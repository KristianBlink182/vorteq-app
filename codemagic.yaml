workflows:
  ios-release-testflight:
    name: iOS TestFlight Build & Release (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Vorteq
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.vorteq.trade
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install Node.js dependencies
        script: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm install --no-save @rolldown/binding-darwin-arm64@1.2.14 || true
      - name: Build Web Application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --project "ios/App/App.xcodeproj"
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build IPA for TestFlight
        script: |
          xcode-project build-ipa \
            --project "ios/App/App.xcodeproj" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
