workflows:
  ios-release-testflight:
    name: iOS TestFlight Build & Release (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Vorteq
    environment:
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install Node.js dependencies
        script: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm install --no-save @rolldown/binding-darwin-arm64@1.2.14 || true
      - name: Build Web Application
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up keychain and fetch/create signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.vorteq.trade" \
            --type IOS_APP_STORE \
            --create
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd ios/App
          BUILD_NUM=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_CONNECT_APP_ID" 2>/dev/null || echo "0")
          if ! [[ "$BUILD_NUM" =~ ^[0-9]+$ ]]; then
            BUILD_NUM=0
          fi
          agvtool new-version -all $(($BUILD_NUM + 1))
      - name: Build IPA for TestFlight
        script: |
          if [ -d "ios/App/App.xcworkspace" ]; then
            xcode-project build-ipa \
              --workspace "ios/App/App.xcworkspace" \
              --scheme "App"
          else
            xcode-project build-ipa \
              --project "ios/App/App.xcodeproj" \
              --scheme "App"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
